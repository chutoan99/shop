<div class="header">
	<div class="flex gap-[60px] items-center justify-left px-[15px] min-w-[85px]" [class.left-side]="collapsed">
		<div class="flex">
			<div class="flex gap-[5px]">
				<span
					class="w-[15px] h-[15px] rounded-full bg-[#f96057] flex justify-center items-center cursor-pointer p-[2px]"></span>
				<span
					class="w-[15px] h-[15px] rounded-full bg-[#f8ce52] flex justify-center items-center cursor-pointer p-[2px]"></span>
				<span
					class="w-[15px] h-[15px] rounded-full bg-[#5fcf65] flex justify-center items-center cursor-pointer p-[2px] group">
					<svg
						(click)="onToggleExpand()"
						class="hidden group-hover:block"
						fill="#000000"
						width="9px"
						height="9px"
						viewBox="-32 0 512 512">
						<g id="SVGRepo_iconCarrier">
							<path
								d="M448 344v112a23.94 23.94 0 0 1-24 24H312c-21.39 0-32.09-25.9-17-41l36.2-36.2L224 295.6 116.77 402.9 153 439c15.09 15.1 4.39 41-17 41H24a23.94 23.94 0 0 1-24-24V344c0-21.4 25.89-32.1 41-17l36.19 36.2L184.46 256 77.18 148.7 41 185c-15.1 15.1-41 4.4-41-17V56a23.94 23.94 0 0 1 24-24h112c21.39 0 32.09 25.9 17 41l-36.2 36.2L224 216.4l107.23-107.3L295 73c-15.09-15.1-4.39-41 17-41h112a23.94 23.94 0 0 1 24 24v112c0 21.4-25.89 32.1-41 17l-36.19-36.2L263.54 256l107.28 107.3L407 327.1c15.1-15.2 41-4.5 41 16.9z"></path>
						</g>
					</svg>
				</span>
			</div>
		</div>
	</div>
	<div class="h-full flex items-center" style="border-left: 1px solid var(--border-color)">
		<button
			type="button"
			class="p-2 flex justify-center items-center rounded-full hover:bg-gray-100 dark:hover:bg-neutral-700 focus:outline-none"
			aria-label="Toggle navigation"
			(click)="onToggleCollapsed()">
			<svg
				class="size-4"
				xmlns="http://www.w3.org/2000/svg"
				width="24"
				height="24"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round">
				<rect width="18" height="18" x="3" y="3" rx="2" />
				<path d="M15 3v18" />
				<path d="m8 9 3 3-3 3" />
			</svg>
		</button>
	</div>
	<div class="header-profile">
		<div class="group relative min-h-[26px] mx-2 my-0 top-[3px]">
			<div class="notification">
				<span class="notification-number">{{notificationList.length }}</span>

				<svg
					viewBox="0 0 24 24"
					fill="currentColor"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					class="feather feather-bell">
					<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" />
				</svg>
			</div>
			<app-header-notification [dataSources]="notificationList"> </app-header-notification>
		</div>

		<svg viewBox="0 0 512 512" fill="currentColor">
			<path
				d="M448.773 235.551A135.893 135.893 0 00451 211c0-74.443-60.557-135-135-135-47.52 0-91.567 25.313-115.766 65.537-32.666-10.59-66.182-6.049-93.794 12.979-27.612 19.013-44.092 49.116-45.425 82.031C24.716 253.788 0 290.497 0 331c0 7.031 1.703 13.887 3.006 20.537l.015.015C12.719 400.492 56.034 436 106 436h300c57.891 0 106-47.109 106-105 0-40.942-25.053-77.798-63.227-95.449z" />
		</svg>

		<div *ngIf="infoShop" class="ml-[20px] flex items-center justify-between gap-[15px]">
			<div class="flex gap-[5px] items-center" [routerLink]="['/user']">
				<div
					class="group no-underline text-sm font-light text-[#fff] min-h-[26px] relative flex items-center mx-2 my-0">
					<div class="w-[35px] h-[35px]">
						<img [src]="infoShop.portrait" class="w-full h-full rounded-[50%]" alt="avartarShop" />
					</div>

					<!-- Dropdown -->
					<ul
						class="group-hover:block hidden absolute z-[2] bg-[#fff] w-[130px] shadow-[0_1px_5px_rgba(189,189,189)] pl-0 rounded-[5px] right-[-15px] top-[calc(100%_+_6px)] after:content-[''] after:top-[-29px] after:absolute after:z-[-1] after:border-solid after:!border-x-[30px] after:!border-y-[20px] after:border-[transparent_transparent_#fff_transparent] after:right-1 before:content-[''] before:block before:absolute before:w-[68%] before:h-2 before:right-0 before:-top-2">
						<li class="hover:bg-[#fafafa] rounded-t-[5px]">
							<a>
								<span
									class="no-underline block !pl-4 py-2 font-inter text-[14px] font-medium leading-[20px] text-[#687182] cursor-pointer">
									My Profile
								</span>
							</a>
						</li>

						<li class="hover:bg-[#fafafa] border-t border-[rgba(0,0,0,0.05)] rounded-b-[5px]">
							<span
								(click)="onSignOut()"
								class="no-underline block !pl-4 py-2 font-inter text-[14px] font-medium leading-[20px] text-[#687182] cursor-pointer">
								Sign Out
							</span>
						</li>
					</ul>
				</div>
				<div class="flex flex-col">
					<span class="text-[#294566] text-[15px] leading-[20px] font-extrabold font-inter">
						{{ infoShop.username }}
					</span>
					<span class="text-[12px] leading-[20px] text-[#333333] font-bold no-underline font-inter">
						shopid: {{ infoShop.id }}
					</span>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="flex-1 p-[20px] h-full">
	<div class="flex-1">
		<div class="h-[100%]">
			<div class="w-full flex gap-y-[10px] justify-between items-center flex-wrap">
				<div class="flex gap-[15px] items-center">
					<div class="search-bar">
						<input
							type="text"
							placeholder="Search products..."
							(input)="onInputSearch($event)"
							(blur)="onSearch()" />
					</div>
					<button nz-button (click)="onOpenFilter()">
						<svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path
								d="M6.85709 10.506C4.37009 8.646 2.59609 6.6 1.62709 5.45C1.32709 5.094 1.22909 4.833 1.17009 4.374C0.968089 2.802 0.867089 2.016 1.32809 1.508C1.78909 1 2.60409 1 4.23409 1H15.7661C17.3961 1 18.2111 1 18.6721 1.507C19.1331 2.015 19.0321 2.801 18.8301 4.373C18.7701 4.832 18.6721 5.093 18.3731 5.449C17.4031 6.601 15.6261 8.651 13.1331 10.514C13.0178 10.6037 12.9225 10.7165 12.8533 10.8451C12.7841 10.9737 12.7425 11.1154 12.7311 11.261C12.4841 13.992 12.2561 15.488 12.1141 16.244C11.8851 17.466 10.1541 18.201 9.22609 18.856C8.67409 19.246 8.00409 18.782 7.93309 18.178C7.66756 15.8765 7.44286 13.5705 7.25909 11.261C7.24882 11.114 7.20771 10.9708 7.13845 10.8407C7.06919 10.7106 6.97333 10.5966 6.85709 10.506Z"
								stroke="#AAAAAA"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round" />
						</svg>
						Filter
					</button>
				</div>
				<nz-pagination
					*ngIf="totalItems > 0"
					nzShowSizeChanger
					[nzPageIndex]="productDto.page"
					[nzPageSize]="productDto.limit"
					[nzTotal]="totalItems"
					[nzPageSizeOptions]="pageOptions"
					(nzPageIndexChange)="onChangePage($event)"
					(nzPageSizeChange)="onChangeOption($event)">
				</nz-pagination>
			</div>

			<ng-container [ngSwitch]="viewDisplay">
				<ng-container *ngSwitchCase="'List'">
					<app-product-list
						[dataSources]="(dataSources$ | async) ?? []"
						(addData)="handleAddData($event)"
						(removeData)="handleRemoveData($event)"
						(sortData)="handleSortData($event)"
						(viewDetail)="handleViewDetail($event)" />
				</ng-container>
				<ng-container *ngSwitchCase="'Table'">
					<app-product-table
						[dataSources]="(dataSources$ | async) ?? []"
						(addData)="handleAddData($event)"
						(removeData)="handleRemoveData($event)"
						(sortData)="handleSortData($event)"
						(viewDetail)="handleViewDetail($event)" />
				</ng-container>
			</ng-container>
			<nz-drawer
				class="px-2"
				[nzWidth]="600"
				[nzClosable]="false"
				[nzVisible]="visible"
				nzPlacement="right"
				(nzOnClose)="onCloseDetail()">
				<ng-container *nzDrawerContent>
					<app-product-drawer #productDrawer></app-product-drawer>
				</ng-container>
			</nz-drawer>
		</div>
	</div>
</div>

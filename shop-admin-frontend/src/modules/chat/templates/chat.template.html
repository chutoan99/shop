				<section

					</div> -->
					<div class="flex flex-row items-center justify-between text-xs pl-[10px] pr-[5px]">
						<span class="font-bold">Active Conversations</span>
						<span class="flex items-center justify-center bg-gray-300 h-4 w-4 rounded-full">4</span>
					</div>
					<div class="flex flex-col gap-[5px] px-[5px] w-full h-full items-center">
						<div
							*ngFor="let item of dataRoom$ | async"
							(click)="onChangeRoom(item)"
							[style.background]="currentRoom?.roomId === item?.roomId ? '#e2e5e9' : 'unset' "
							class="hover:bg-[#e2e5e9] overflow-hidden rounded-[10px] px-[5px] py-[5px] items-center box-border flex justify-center overflow-hidden relative w-full cursor-pointer pr-[5px]">
							<div class="h-9 min-w-[32px] w-9">
								<div
									class="items-center text-[#fff] flex text-[0] font-medium h-full justify-center overflow-hidden w-full rounded-sm"
									style="background-color: 'unset'">
									<div class="w-full h-full">
										<div
											class="flex items-center justify-center h-9 w-9 rounded-full flex-shrink-0 border-[1px] border-[#cccccc] border-solid">
											<div
												class="bg-cover bg-no-repeat w-9 h-9 rounded-full"
												[style.background-image]="'url(' + item.user.avatar + ')'"></div>
										</div>
									</div>
								</div>
							</div>
							<div class="flex gap-[2px] flex-1 flex-col shrink-0 justify-center w-[156px] ml-2.5">
								<div class="items-center flex justify-between">
									<div
										class="text-[#333] text-[13px] font-bold leading-[15px] max-w-[80%] overflow-hidden text-ellipsis whitespace-nowrap mr-1">
										{{ item.user.name }}
									</div>
								</div>
								<div class="items-center flex justify-between">
									<div
										class="text-[#888] text-xs leading-[15px] max-w-[100%] overflow-hidden text-ellipsis whitespace-nowrap mr-1">
										<span title="Honey ơi, sản phẩm bạn thích đang giảm mạnh đến 50">....</span>
									</div>
									<div
										class="text-[#bbb] text-xs leading-[15px] translate-x-0.5 whitespace-nowrap scale-[0.91]">
										{{ item.createdAt | dateAgo }}
									</div>
								</div>
							</div>
						</div>
					</div>
				</section>
			</div>

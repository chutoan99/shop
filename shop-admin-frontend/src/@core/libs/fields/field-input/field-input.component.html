			placeholder="{{ field.Name }}"
			class="p-2"
			nz-input

        disabled: !field.AllowEdit

    </div>
    <div class="is__invalid-error" *ngIf="form.get(field.Name)?.errors">
      <div *ngIf="form.get(field.Name)?.errors['customError']">

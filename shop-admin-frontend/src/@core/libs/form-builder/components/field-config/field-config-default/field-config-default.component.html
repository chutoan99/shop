<nz-modal
	*ngIf="visible"
	position="center"
	header="Header"
	[style]="{ width: '540px' }"
	[draggable]="true"
	[(nzVisible)]="visible">
	<ng-template pTemplate="header" class="dialogHeader">
		<div class="w-full">
			<h3 class="text-md pl-3 font-bold text-foreground">{{ header | uppercase }}</h3>
		</div>
	</ng-template>

      <ng-container *ngSwitchCase="tabs[0]">

          <label class="required mb-2 flex items-center bg-background text-sm text-foreground">Tên trường</label>
          <app-dynamic-input
            [field]="dataInputBase.get('InputName')"
            [form]="formPopup"
            [isMultiRow]="true"
            [submitted]="false" />
        </div>
        <div class="mb-4">
          <label class="required mb-2 flex items-center bg-background text-sm text-foreground">Câu hỏi</label>
          <app-dynamic-input
            [field]="dataInputBase.get('Question')"
            [form]="formPopup"
            [isMultiRow]="true"
            [submitted]="false" />
        </div>
        <div class="mb-4 flex items-center gap-[7px]">
          <app-dynamic-checkbox
            [field]="dataInputBase.get('IsRequired')"
            [form]="formPopup"
            [isMultiRow]="true"
            [submitted]="false" />
          <label class="flex items-center bg-background text-sm text-foreground">Trường bắt buộc</label>
        </div>
        <div class="mb-4 flex items-center gap-[7px]">
          <app-dynamic-checkbox
            [field]="dataInputBase.get('IsReadOnly')"
            [form]="formPopup"
            [isMultiRow]="true"
            [submitted]="false" />
          <label class="flex items-center bg-background text-sm text-foreground">Chỉ xem</label>
        </div>
      </ng-container>
      <ng-container *ngSwitchCase="tabs[1]">
        <div class="mb-2">
          <label class="mb-2 flex items-center bg-background text-sm text-foreground">Hướng dẫn nhập</label>
          <app-dynamic-long-text
            [field]="dataInputBase.get('Guide')"
            [form]="formPopup"
            [isMultiRow]="true"
            [submitted]="false" />
        </div>
        <div class="mb-2 flex items-center gap-[5px]">

          </svg>
          <span class="text-[15px] font-medium">Mô tả để người khác hiểu rõ hơn về trường dữ liệu này</span>
        </div>
      </ng-container>
      <ng-container *ngSwitchCase="tabs[2]">
        <div class="mb-6 flex items-center gap-[10px]">
          <div class="flex w-full flex-wrap justify-between gap-[10px]" formGroupName="DataTypeSetting">
            <div class="align-items-center flex gap-[7px]">
              <p-radioButton [value]="VALUE.ValueDefault" formControlName="TypeValue" />
              <label for="Config1" class="flex items-center bg-background text-sm text-foreground">
                Thiết lập sẵn
              </label>
            </div>
            <div class="align-items-center flex gap-[7px]">
              <p-radioButton [value]="VALUE.DataCMS" formControlName="TypeValue" />
              <label for="Config2" class="flex items-center bg-background text-sm text-foreground">
                Dữ liệu từ CMS
              </label>
            </div>
          </div>
        </div>
        <ng-container [ngSwitch]="formPopup.get('DataTypeSetting').get('TypeValue')?.value">
          <ng-container *ngSwitchCase="VALUE.ValueDefault">
            <div class="mb-4">
              <app-dynamic-input
                [field]="dataInputBase.get('ValueDefault')"
                [form]="formPopup.get('DataTypeSetting')"
                [isMultiRow]="true"
                [submitted]="false" />
            </div>
          </ng-container>
          <ng-container *ngSwitchCase="VALUE.DataCMS">
            <div class="mb-2">
              <label class="required mb-2 flex items-center bg-background text-sm text-foreground"
                >Chọn cột đồng bộ</label
              >
              <app-dynamic-select-option
                bindLabel="Name"
                [field]="dataInputBase.get('DataCMS')"
                [form]="formPopup.get('DataTypeSetting')"
                [isMultiRow]="true"
                [submitted]="false"
                [optionList]="optionColCMS"
                styleClass="bg-background text-sm text-foreground rounded-md border border-border" />
            </div>
            <div class="mb-4 flex items-center gap-[5px]">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">

        </ng-container>
      </ng-container>
    </ng-container>
  </form> -->

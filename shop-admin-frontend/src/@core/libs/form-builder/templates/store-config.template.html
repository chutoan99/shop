			<div class="mt-[15px] flex items-center justify-between px-2 pb-1 pt-2">
				<div class="flex items-center justify-between">
					<div class="flex-col items-center">
						<h3 class="line-clamp-1 text-[15px] font-semibold text-foreground">Nội dung hiển thị</h3>
					</div>
				</div>
			</div>

			<ul class="mt-[10px] flex flex-col gap-[0.625rem]">
				@for (content of displayContent; track $index) {
				<li
					style="background: rgba(255, 255, 255, 50%)"
					[ngClass]="{
      					'opacity-50': content.Disable,
      					'pointer-events-none': content.Disable
					}"
					class="shadow-1 flex h-[45px] w-full items-center justify-between rounded-[5px] pl-[0.938rem] pr-[0.625rem]">
					<div class="flex items-center gap-[5px]">
						<div class="flex items-center gap-[4px]">
							<div>
								<img [src]="content.Icon" width="100%" height="100%" alt="" />
							</div>
							{{ content.Name }}
						</div>
					</div>
					<div class="cursor-pointer rounded-[5px] px-[3px] py-[3px] hover:bg-[#0000001A]">
						<img src="/assets/svg/fields/add.svg" width="25px" height="100%" alt="" />
					</div>
				</li>
				}
			</ul>

			<div class="flex items-center justify-between px-2 pb-1 pt-3">
				<div class="flex items-center justify-between">

					</div>
				</div>
			</div>

						</div>
						<div class="flex items-center gap-[4px]">
							<div>

					<div class="cursor-pointer rounded-[5px] px-[3px] py-[3px] hover:bg-[#0000001A]">
						<img src="/assets/svg/fields/add.svg" width="25px" height="100%" alt="" />
					</div>
				</li>
				}
			</ul>
		</div>
